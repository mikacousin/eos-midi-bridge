name: Rust Multi-Platform Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            suffix: .exe
            artifact_name: windows
          - os: ubuntu-latest
            suffix: ""
            artifact_name: linux
          - os: macos-latest
            suffix: ""
            artifact_name: macos

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

    - name: Build
      run: cargo build --release --verbose

    - name: Run Tests
      run: cargo test --verbose

    - name: Prepare Package
      shell: bash
      run: |
        PACKAGE_NAME="eos-midi-bridge-${{ matrix.artifact_name }}"
        mkdir -p "$PACKAGE_NAME/profiles"
        cp target/release/eos-midi-bridge${{ matrix.suffix }} "$PACKAGE_NAME/"
        cp profiles/*.json "$PACKAGE_NAME/profiles/"
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          7z a "${PACKAGE_NAME}.zip" "$PACKAGE_NAME"
          echo "ASSET_NAME=${PACKAGE_NAME}.zip" >> $GITHUB_ENV
        else
          tar -czf "${PACKAGE_NAME}.tar.gz" "$PACKAGE_NAME"
          echo "ASSET_NAME=${PACKAGE_NAME}.tar.gz" >> $GITHUB_ENV
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}-package
        path: ${{ env.ASSET_NAME }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*
          generate_release_notes: true
          draft: false
          prerelease: false
