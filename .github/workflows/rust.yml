name: Rust Multi-Platform Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            suffix: .exe
            artifact_name: windows
          - os: ubuntu-latest
            suffix: ""
            artifact_name: linux
          - os: macos-latest
            suffix: ""
            artifact_name: macos

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

    - name: Build
      run: cargo build --release --verbose

    - name: Run Tests
      run: cargo test --verbose

    - name: Prepare Binary
      run: |
        mkdir -p bin
        cp target/release/eos-midi-bridge${{ matrix.suffix }} bin/eos-midi-bridge-${{ matrix.artifact_name }}${{ matrix.suffix }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: eos-midi-bridge-${{ matrix.artifact_name }}
        path: bin/

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/eos-midi-bridge-windows.exe
            bin/eos-midi-bridge-linux
            bin/eos-midi-bridge-macos
          generate_release_notes: true
          draft: false
          prerelease: false
