[package]
name="eos-midi-bridge"
version="0.0.4"
edition="2024"

[dependencies]
midir = "0.10.3"
rosc = "0.11.4"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow = "1.0"
deunicode = "1.6.2"
log = "0.4"
env_logger = "0.11"
confy = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = "0.33"
egui = "0.33"
egui-file-dialog = "0.12"
egui-snarl = "0.9"

[build-dependencies]
winres = "0.1"
